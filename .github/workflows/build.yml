name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (Linux CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ppcli with gcc and clang
        run: |
          make -C tools CC=gcc
          make -C tools clean
          make -C tools CC=clang
      - uses: actions/upload-artifact@v4
        with:
          name: ppcli-linux-x86_64
          path: tools/ppcli

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/PocketPager-${GITHUB_SHA::7}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPager-apk
          path: out/*.apk
